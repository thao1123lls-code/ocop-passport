# high-concurrency-form/load-test/artillery-test.yml
# Kịch bản kiểm thử tải bằng Artillery
# Chạy lệnh: npx artillery run high-concurrency-form/load-test/artillery-test.yml

config:
  target: "http://localhost:5000"
  phases:
    - duration: 20
      arrivalRate: 50
      name: "Giai đoạn khởi động (50 req/giây)"
    - duration: 30
      arrivalRate: 300
      name: "Tăng tải đột biến (300 req/giây)"
    - duration: 20
      arrivalRate: 800
      name: "Tải cực đại Flash Sale (800 req/giây)"

scenarios:
  - name: "Gửi Form Đăng Ký Chịu Tải Cao"
    flow:
      - post:
          url: "/api/submit-form"
          headers:
            Content-Type: "application/json"
            Idempotency-Key: "ARTILLERY-{{ $randomNumber(100000, 999999) }}-{{ $timestamp }}"
          json:
            fullName: "Khách hàng Artillery"
            email: "artillery_{{ $randomNumber(1000, 9999) }}@loadtest.vn"
            phone: "0901234567"
            category: "OCOP_EXPO_VIP"
          expect:
            - statusCode: 202
            - contentType: json
            - hasProperty: trackingId
