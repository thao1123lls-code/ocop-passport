<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Đang ngoại tuyến · OCOP Passport</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
        font: 16px/1.6 system-ui, sans-serif;
      }
      main {
        width: min(100%, 480px);
        padding: 32px;
        border: 1px solid #334155;
        border-radius: 20px;
        background: #1e293b;
        text-align: center;
      }
      h1 { margin: 0 0 12px; font-size: clamp(24px, 6vw, 34px); }
      p { margin: 0 0 24px; color: #cbd5e1; }
      button {
        min-height: 44px;
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        background: #38bdf8;
        color: #0f172a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Đang ngoại tuyến</h1>
      <p>Trang này chưa được lưu trên thiết bị. Hãy kiểm tra kết nối rồi tải lại trang bạn đang mở.</p>
      <button type="button" onclick="location.reload()">Tải lại trang</button>
    </main>
  </body>
</html>
